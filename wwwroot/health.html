<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MES Health Check</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f5f5f5; padding:20px; }
        .card { max-width:800px; margin:0 auto; background:#fff; padding:20px; border-radius:8px;
                box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-top:0; }
        table { border-collapse:collapse; width:100%; margin-top:10px; }
        th, td { border:1px solid #ddd; padding:8px 10px; font-size:14px; }
        th { background:#f0f0f0; }
        .ok { color:#2ecc71; font-weight:bold; }
        .error { color:#e74c3c; font-weight:bold; }
        .timestamp { font-size:12px; color:#777; margin-top:5px; }
        button { padding:6px 10px; font-size:13px; border-radius:4px; border:1px solid #3498db;
                 background:#3498db; color:#fff; cursor:pointer; margin-bottom:10px; }
        button:hover { background:#2980b9; }
    </style>
</head>
<body>
<div class="card">
    <h1>MES Health Check</h1>
    <button onclick="loadHealth()">Refresh</button>
    <div id="statusArea">Đang tải...</div>
    <div class="timestamp" id="timeArea"></div>
</div>

<script>
async function loadHealth() {
    const statusArea = document.getElementById('statusArea');
    const timeArea = document.getElementById('timeArea');
    statusArea.textContent = 'Đang tải...';
    timeArea.textContent = '';

    try {
        const res = await fetch('/api/health');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        timeArea.textContent = 'Server time: ' + data.serverTime;

        const orderDb = data.databases.orderTracking;
        const blowDb  = data.databases.blowFill;
        const toolDb  = data.databases.tool;
        const online  = data.signalR ? data.signalR.onlineConnections : 0;

        statusArea.innerHTML = `
            <p><strong>SignalR online connections:</strong> ${online}</p>
            <h3>Database sizes</h3>
            <table>
                <tr><th>Database</th><th>Size (KB)</th><th>Chi tiết</th></tr>
                <tr>
                    <td>OrderTracking.db</td>
                    <td>${orderDb.sizeKb}</td>
                    <td>Orders: ${orderDb.orderCount}, MoProgresses: ${orderDb.moProgressCount}</td>
                </tr>
                <tr>
                    <td>BlowFillWeigh.db</td>
                    <td>${blowDb.sizeKb}</td>
                    <td>WeighLogs 7 ngày gần nhất: ${blowDb.weighLogLast7Days}, Context: ${blowDb.contextCount}</td>
                </tr>
                <tr>
                    <td>ToolManagement.db</td>
                    <td>${toolDb.sizeKb}</td>
                    <td>ToolChanges 30 ngày gần nhất: ${toolDb.toolChangesLast30Days}</td>
                </tr>
            </table>
        `;
    } catch (err) {
        statusArea.innerHTML = `<span class="error">Lỗi khi gọi /api/health: ${err.message}</span>`;
    }
}

window.onload = loadHealth;
</script>
</body>
</html>
