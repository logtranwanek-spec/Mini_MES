<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC - Báo cáo Supplier mài dao</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .report-container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        .report-header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 96px; padding: 20px 30px; border-radius: 12px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
        .report-header h1 { margin: 0; line-height: 1.2; }
        .report-header-actions { display: flex; align-items: stretch; justify-content: flex-end; gap: 12px; flex-shrink: 0; }
        .report-header-actions > a,
        .report-header-actions > button { box-sizing: border-box; min-width: 128px; min-height: 48px; margin: 0; padding: 10px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 8px; font-size: 15px; font-weight: 700; line-height: 1.2; text-align: center; text-decoration: none; white-space: nowrap; }
        .report-header-actions .btn-view-toggle { min-width: 76px; width: auto; padding-inline: 16px; }
        .report-header-actions .btn-back-home:active { transform: scale(0.97); }
        @media (max-width: 900px) {
            .report-header { flex-direction: column; align-items: stretch; padding: 20px; }
            .report-header h1 { text-align: center; font-size: 28px; }
            .report-header-actions { justify-content: center; flex-wrap: wrap; }
            .report-header-actions > a,
            .report-header-actions > button { flex: 1 1 150px; }
        }
        @media (max-width: 520px) {
            .report-container { margin-top: 15px; padding: 0 12px; }
            .report-header h1 { font-size: 23px; }
            .report-header-actions { flex-direction: column; }
            .report-header-actions > a,
            .report-header-actions > button { width: 100%; flex-basis: auto; }
        }
        .chart-card { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        html.simple-view .report-header { background: #fff; border-bottom: 1px solid #e2e8f0; }
        html.simple-view .chart-card { background: #fff; border: 1px solid #e2e8f0; }
    </style>
    <link rel="stylesheet" href="/css/page-scale-75.css">
</head>
<body>
    <div class="report-container">
        <!-- Header -->
        <div class="report-header">
            <h1>📊 Báo cáo Supplier mài dao</h1>
            <div class="report-header-actions">
                <a href="/cnc-go" class="btn btn-primary" style="text-decoration: none;">📝 Nhập liệu</a>
                <a href="/" class="btn-back-home">🏠 Trang chủ</a>
                <button class="btn-view-toggle btn-global-toggle">🎨 Chế độ đơn giản</button>
            </div>
        </div>
        
        <!-- Chart -->
        <div class="chart-card">
            <h2 style="text-align: center; margin-bottom: 20px;">Tổng thời gian chạy theo Supplier, máy và dao</h2>
            <canvas id="performanceChart" height="120"></canvas>
        </div>

        <!-- Table -->
        <div style="overflow-x: auto;">
            <h2>Chi tiết dữ liệu</h2>
            <table>
                <thead>
                    <tr>
                        <th>Supplier</th>
                        <th>Máy</th>
                        <th>Dao số</th>
                        <th>Tổng thời gian chạy</th>
                    </tr>
                </thead>
                <tbody id="supplierReportBody">
                    <tr><td colspan="4" class="loading-text">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        let performanceChart = null;

        async function loadReport() {
            const tbody = document.getElementById('supplierReportBody');
            try {
                const response = await fetch('/api/tools/supplier-performance');
                const data = await response.json();

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px;">Chưa có dữ liệu của An Bình hoặc Trang Tuyển</td></tr>';
                    return;
                }
                
                renderTable(data);
                renderChart(data);

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #e74c3c;">❌ Lỗi: ${error.message}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('supplierReportBody');
            tbody.innerHTML = '';
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold;">${item.supplier}</td>
                        <td>${item.machineName}</td>
                        <td style="text-align: center;">${getToolNumber(item.toolNumber)}</td>
                        <td style="font-weight: bold; color: #3498db;">${Number(item.totalHours).toLocaleString('vi-VN')} giờ</td>
                    </tr>
                `;
            });
        }

        function renderChart(data) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (performanceChart) performanceChart.destroy();

            const labels = data.map(item => `${item.supplier} - ${item.machineName} - Dao ${getToolNumber(item.toolNumber)}`);
            const chartData = data.map(item => item.totalHours);
            
            // Tạo màu ngẫu nhiên cho mỗi supplier
            const suppliers = [...new Set(data.map(item => item.supplier))];
            const colors = ['#3498db', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#1abc9c'];
            const backgroundColors = data.map(item => {
                const index = suppliers.indexOf(item.supplier);
                return colors[index % colors.length];
            });

            performanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tổng thời gian chạy',
                        data: chartData,
                        backgroundColor: backgroundColors,
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Tổng thời gian chạy (giờ)' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function getToolNumber(toolAddress) {
            const match = String(toolAddress || '').match(/Dao(\d+)$/i);
            return match ? match[1] : String(toolAddress || '');
        }

        window.onload = loadReport;
    </script>
</body>
</html>
