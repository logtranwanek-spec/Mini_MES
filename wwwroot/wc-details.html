<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Work Center - Dạng Timeline</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <div class="dash-header" style="position: sticky; top: 0; z-index: 1001; display: flex; justify-content: space-between; align-items: center;">
        <h1 style="background: none; color: #fff; margin: 0;">📊 CHI TIẾT WORK CENTER</h1>
        <a href="/tracking" class="btn-back-home">⬅️ Quay lại Tracking</a>
    </div>

    <div class="wc-details-container">
        <!-- Hàng 1: Lọc theo Work Center -->
        <div class="filter-section" id="wcFilterSection">
            <strong class="filter-title">Work Center</strong>
            <div id="wcFilterContainer" class="filter-bar">
                <!-- Nút lọc WC sẽ được thêm vào đây -->
            </div>
        </div>

        <!-- Hàng 2: Lọc (Cuộn) theo Leadtime -->
        <div class="filter-section" id="timeFilterSection">
            <strong class="filter-title">Lead Time</strong>
            <div id="timeFilterContainer" class="filter-bar">
                <!-- Nút lọc thời gian sẽ được thêm vào đây -->
            </div>
        </div>

        <!-- Timeline hiển thị kết quả -->
        <div id="timelineView" class="timeline-view">
            <!-- Các dòng thời gian sẽ được vẽ ở đây -->
        </div>
    </div>

    <!-- MODAL CHI TIẾT QUÉT MO -->
    <div id="modalMoScanDetail" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header modal-header-info">
                <h2>📋 CHI TIẾT QUÉT MO: <span id="moDetailTitle">-</span></h2>
                <button class="btn-close" onclick="document.getElementById('modalMoScanDetail').classList.remove('active')">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Thông tin tổng quan -->
                <div class="mo-scan-summary">
                    <div class="summary-item" id="moMxBox">
                        <span class="summary-label">📦 MX:</span>
                        <span class="summary-value" id="moMx">-</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">📦 Kế hoạch:</span>
                        <span class="summary-value" id="moPlannedQty">-</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">✅ Đã quét:</span>
                        <span class="summary-value" id="moScannedQty">-</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">⏱️ Leadtime:</span>
                        <span class="summary-value" id="moLeadtime">-</span>
                    </div>
                </div>

                <!-- Danh sách lịch sử quét -->
                <div class="mo-scan-history-section">
                    <h3>📊 LỊCH SỬ QUÉT:</h3>
                    <div id="moScanHistoryList" class="scan-history-list">
                        <p style="text-align: center; color: #95a5a6;">Đang tải...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/wc-details.js"></script>
</body>
</html>
