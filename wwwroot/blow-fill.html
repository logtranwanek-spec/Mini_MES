<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weigh Monitor - Blow Fill Station</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
            overflow-y: auto;
        }

        /* Header */
        .header {
            display: flex;
            height: 55px;
            flex-shrink: 0;
        }

        .header-title {
            flex: 3;
            background-color: white;
            border: 3px solid black;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .wc-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
        }

        .wc-selector label {
            font-weight: bold;
        }

        .wc-selector select {
            font-size: 16px;
            padding: 2px 6px;
        }

        .header-station {
            flex: 1;
            background-color: #FFB366;
            border: 3px solid black;
            border-left: none;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Product Info */
        .product-section {
            display: flex;
            gap: 15px;
            flex-shrink: 0;
        }

        .product-inputs {
            flex: 1;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .input-group label {
            width: 140px;
            font-size: 30px;
            font-weight: bold;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            font-size: 45px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #E0E0E0;
            border-radius: 5px;
        }

        .input-group input.mo-input {
            font-size: 45px;
            color: red;
        }

        /* Status Legend & Tolerance */
        .status-legend {
            width: 180px;
            padding: 15px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .status-legend h3 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: bold;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .status-circle {
            font-size: 24px;
        }
        .status-item span:last-child {
            font-size: 16px;
            font-weight: bold;
        }
        .status-circle.under { color: #FFEB3B; }
        .status-circle.ok { color: #4CAF50; }
        .status-circle.over { color: #F44336; }

        .tolerance-group {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tolerance-group label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }
        .tolerance-group input {
            width: 65px;
            padding: 4px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            -moz-appearance: textfield;
        }
        .tolerance-group input::-webkit-outer-spin-button,
        .tolerance-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Info Bar */
        .info-bar {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-shrink: 0;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-item label {
            font-size: 30px;
            font-weight: bold;
        }

        .info-item .value {
            padding: 12px 20px;
            font-size: 35px;
            font-weight: bold;
            border-radius: 5px;
            border: 3px solid;
        }

        .info-item .value.step {
            color: #2196F3;
            background-color: #E3F2FD;
            border-color: #2196F3;
        }

        .info-item .value.counter {
            color: #4CAF50;
            background-color: #E8F5E9;
            border-color: #4CAF50;
        }

        /* Step Indicators - DYNAMIC */
        .steps-container {
            display: flex;
            gap: 15px; /* Tăng gap cho dễ nhìn */
            flex-shrink: 0;
            justify-content: center; /* Căn giữa các steps */
            flex-wrap: wrap; /* Cho phép xuống dòng nếu quá nhiều steps */
        }

        .step-indicator {
            text-align: center;
            min-width: 80px; /* Đảm bảo step không bị nhỏ quá */
        }

        .step-indicator .label {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .step-indicator .circle {
            font-size: 40px;
            font-weight: bold;
            color: #E0E0E0;
        }

        .step-indicator .circle.completed { color: #4CAF50; }
        .step-indicator .circle.current { color: #FFEB3B; }
        .step-indicator .circle.pending { color: #E0E0E0; }

        /* Weight Displays */
        .weights-container {
            display: flex;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }

        .weight-display {
            flex: 1;
            border: 5px solid;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .weight-display.target {
            background-color: #C8E6C9;
            border-color: #4CAF50;
        }

        .weight-display.current {
            background-color: #BBDEFB;
            border-color: #2196F3;
        }

        .weight-display h3 {
            font-size: 50px;
            font-weight: bold;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .weight-display.target h3 {
            background-color: #81C784;
        }

        .weight-display.current h3 {
            background-color: #64B5F6;
        }

        /* WEIGHT VALUES */
        .weight-value {
            font-size: clamp(100px, 15vw, 300px);
            font-weight: 900;
            text-align: center;
            padding: 15px;
            border-radius: 5px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .weight-display.target .weight-value {
            background-color: #E8F5E9;
        }

        .weight-display.current .weight-value {
            background-color: #E3F2FD;
        }

        .weight-value.under {
            background-color: #FFF9C4 !important;
            color: #F57F17;
            border: 5px solid #FFEB3B;
        }

        .weight-value.ok {
            background-color: #C8E6C9 !important;
            color: #2E7D32;
            border: 5px solid #4CAF50;
        }

        .weight-value.over {
            background-color: #FFCDD2 !important;
            color: #C62828;
            border: 5px solid #F44336;
        }

        .weight-value.not-found {
            background-color: #FFCDD2 !important;
            color: #C62828;
            border: 5px solid #F44336;
            font-size: clamp(40px, 6vw, 70px);
            font-weight: bold;
        }

        /* Control Panel */
        .control-panel {
            border: 2px solid #999;
            padding: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        .control-panel label {
            font-size: 13px;
            font-weight: bold;
        }

        .control-panel input {
            padding: 6px;
            font-size: 14px;
            width: 120px;
        }

        .control-panel button {
            padding: 8px 12px;
            font-size: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .btn-reload {
            background-color: #4CAF50;
        }

        .btn-reload:hover {
            background-color: #45a049;
        }

        .btn-reset {
            background-color: #FF9800;
        }

        .btn-reset:hover {
            background-color: #F57C00;
        }

        /* Responsive adjustments */
        @media (max-height: 800px) {
            .header {
                height: 50px;
            }
            .header-title, .header-station {
                font-size: 18px;
                padding: 10px;
            }
            .weight-display h3 {
                font-size: 40px;
            }
            .info-item label {
                font-size: 24px;
            }
            .info-item .value {
                font-size: 28px;
            }
            .input-group label {
                font-size: 24px;
            }
            .input-group input {
                font-size: 35px;
            }
        }

        @media (max-width: 1200px) {
            .product-section {
                flex-direction: column;
            }
            .status-legend {
                width: 100%;
                display: flex;
                justify-content: space-around;
            }
            .status-legend h3 {
                display: none;
            }
        }

        .part-tab {
            padding: 8px 15px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #ccc;
            background: #f0f0f0;
            color: #555;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .part-tab:hover {
            border-color: #007bff;
            color: #007bff;
        }

        .part-tab.active {
            border-color: #28a745;
            background-color: #28a745;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <span>MÀN HÌNH HIỂN THỊ KHỐI LƯỢNG</span>
                <div class="wc-display">
                    <label>WC:</label>
                    <span id="wcDisplay" style="font-weight: bold; color: #2196F3;">---</span>
                </div>
            </div>
            <div class="header-station">WNK3 - BLOW FILL</div>
        </div>

        <!-- Product Info + Status -->
        <div class="product-section">
            <div class="product-inputs">
                <div class="input-group">
                    <label>MO</label>
                    <input type="text" id="moInput" class="mo-input" placeholder="Enter MO code...">
                </div>
                <div class="input-group">
                    <label>Fiber Kit</label>
                    <input type="text" id="fiberInput" placeholder="Loading Excel data..." readonly>
                </div>
            </div>
            <div class="status-legend">
                <h3>Status</h3>
                <div class="status-item"><span class="status-circle under">●</span><span>UNDER</span></div>
                <div class="status-item"><span class="status-circle ok">●</span><span>OK</span></div>
                <div class="status-item"><span class="status-circle over">●</span><span>OVER</span></div>
                <div class="tolerance-group">
                    <label>Tolerance (g)</label>
                    <input type="number" id="toleranceInput" value="50" step="1" oninput="updateTolerance()">
                </div>
            </div>
        </div>
        
        <!-- Info Bar -->
        <div class="info-bar">
            <div class="info-item">
                <label>Current Step:</label>
                <div class="value step" id="stepInfo">-</div>
            </div>
            <div class="info-item">
                <label>Completed Today:</label>
                <div class="value counter" id="counterDisplay">0</div>
            </div>
        </div>

        <!-- ✅ KHU VỰC HIỂN THỊ PART VÀ STEP (GỘP LẠI) -->
        <div id="processContainer" style="margin-top: 15px; text-align: center;">
            <!-- Các nút chọn part (part tabs) sẽ được chèn vào đây -->
            <div id="partTabs" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;"></div>
            
            <!-- Các chỉ báo step (step indicators) -->
            <div class="steps-container" id="stepsContainer"></div>
        </div>

        <!-- Weight Displays -->
        <div class="weights-container">
            <div class="weight-display target">
                <h3>Target Weight</h3>
                <div class="weight-value" id="targetWeight">-</div>
            </div>
            <div class="weight-display current">
                <h3>Current Weight</h3>
                <div class="weight-value" id="currentWeight">-</div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
                <button class="btn-reload" onclick="loadExcelData()">🔄 Reload Định Mức</button>
                <button class="btn-reset" onclick="resetCounter()">🔄 Reset Counter</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    <script>
        // ==================== GLOBAL VARIABLES ====================
        let productDatabase = {};
        let currentFiberKitParts = []; // Danh sách các part của fiber kit hiện tại
        let currentProductData = null; // Dữ liệu của part đang được chọn
        let currentStep = 0;
        let totalSteps = 0;
        let targetWeight = 0;
        let currentWeight = 0;
        let toleranceKg = 0.05;
        let productCounter = 0;
        let stepCompleted = false;
        let weightStableTime = 0;
        let currentWc = '';
        let machineId = null;
        let scanTimeout = null;
        let partSelected = false;
        let currentPartIndex = 0;
        const SCAN_DELAY = 300;
        const WEIGHT_STABLE_TIME = 2.0;

        // ==================== DOM ELEMENTS CACHE ====================
        const DOM = {}; // Sẽ cache các element ở onload

        // ==================== SIGNALR SETUP ====================
        let connection = null;

        async function startSignalR() {
            try {
                connection = new signalR.HubConnectionBuilder()
                    .withUrl("/orderHub")
                    .withAutomaticReconnect()
                    .build();

                connection.on("ReceiveScaleData", (weight) => {
                    currentWeight = weight;
                });

                connection.on("BlowFillContextUpdated", (ctx) => {
                    console.log("📡 Context updated from other client:", ctx);
                    applyContextFromServer(ctx);
                });

                await connection.start();
                console.log("✅ SignalR Connected.");

                if (machineId) {
                    await connection.invoke("JoinGroup", machineId);
                    console.log(`✅ Joined group: ${machineId}`);
                }
            } catch (err) {
                console.error("SignalR Connection Error: ", err);
                setTimeout(startSignalR, 5000);
            }
        }

        async function loadExistingContext() {
            try {
                const res = await fetch(`/api/blow-fill/context?machineId=${encodeURIComponent(machineId)}`);
                const data = await res.json();
                if (!data.found) {
                    console.log(`No existing context for machine ${machineId}`);
                    return;
                }
                console.log("🔁 Loaded context from server:", data);
                applyContextFromServer(data);
            } catch (err) {
                console.error("❌ Error loading context:", err);
            }
        }

        function applyContextFromServer(ctx) {
            if (!ctx || !ctx.mo) return;

            // MO, FiberKit, WC
            DOM.moInput.value = ctx.mo;
            DOM.fiberInput.value = ctx.fiberKit || '';
            DOM.wcDisplay.textContent = ctx.workCenter || '---';

            // Tìm FiberKit trong Excel
            if (ctx.fiberKit) {
                const fiberKitKey = ctx.fiberKit.trim().toUpperCase();
                currentFiberKitParts = productDatabase[fiberKitKey] || [];
                // ⭐ Loại bỏ part trùng description
                currentFiberKitParts = dedupePartsByDescription(currentFiberKitParts);
            } else {
                currentFiberKitParts = [];
            }

            // Xác định currentPartIndex, currentStepIndex
            const partIndex = ctx.currentPartIndex != null ? ctx.currentPartIndex : 0;
            const stepIndex = ctx.currentStep != null ? ctx.currentStep - 1 : 0;

            if (currentFiberKitParts.length > 0) {
                renderPartTabs();

                // clamp partIndex
                currentPartIndex = Math.max(0, Math.min(partIndex, currentFiberKitParts.length - 1));
                currentProductData = currentFiberKitParts[currentPartIndex];

                totalSteps = ctx.totalSteps || currentProductData.steps.length;

                // clamp stepIndex
                const safeStepIndex = Math.max(0, Math.min(stepIndex, totalSteps - 1));

                targetWeight = ctx.targetWeight || currentProductData.steps[safeStepIndex].target_weight;

                createStepIndicators(totalSteps);
                updateStepIndicators(safeStepIndex);

                DOM.targetWeight.textContent = targetWeight.toFixed(2);
                DOM.stepInfo.textContent = `Step ${safeStepIndex + 1} of ${totalSteps}`;

                currentStep = safeStepIndex;
                partSelected = true;
            } else {
                totalSteps = ctx.totalSteps || 0;
                targetWeight = ctx.targetWeight || 0;

                createStepIndicators(totalSteps);
                const safeStepIndex = Math.max(0, Math.min(stepIndex, totalSteps - 1));
                updateStepIndicators(safeStepIndex);

                DOM.targetWeight.textContent = targetWeight > 0 ? targetWeight.toFixed(2) : '-';
                DOM.stepInfo.textContent = totalSteps > 0
                    ? `Step ${safeStepIndex + 1} of ${totalSteps}`
                    : '-';

                currentStep = safeStepIndex;
                partSelected = totalSteps > 0;
            }
        }

        // ==================== INITIALIZATION ====================
        function getQueryParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        let role = null;

        window.onload = async function() {
            // Cache DOM elements
            DOM.moInput = document.getElementById('moInput');
            DOM.fiberInput = document.getElementById('fiberInput');
            DOM.wcDisplay = document.getElementById('wcDisplay');
            DOM.partTabs = document.getElementById('partTabs');
            DOM.stepsContainer = document.getElementById('stepsContainer');
            DOM.targetWeight = document.getElementById('targetWeight');
            DOM.currentWeight = document.getElementById('currentWeight');
            DOM.stepInfo = document.getElementById('stepInfo');
            DOM.counterDisplay = document.getElementById('counterDisplay');

            machineId = getQueryParam('machine');
            role = getQueryParam('role') || 'operator';
            if (!machineId) machineId = prompt("Nhập mã máy (vd: M1, M2):");
            if (!machineId) {
                alert("Bạn phải nhập mã máy để sử dụng hệ thống.");
                return;
            }

            await loadExcelData();
            await startSignalR();
            await loadExistingContext();
            
            setupEventListeners();
            updateTolerance();
            setInterval(checkWeightStatus, 100);
        };

        function setupEventListeners() {
            if (role === 'operator') {
                DOM.moInput.focus();
                DOM.moInput.addEventListener('input', () => {
                    if (scanTimeout) clearTimeout(scanTimeout);
                    if (DOM.moInput.value.trim().length === 7) {
                        scanTimeout = setTimeout(() => onMoEntered(), SCAN_DELAY);
                    }
                });
                DOM.moInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        if (scanTimeout) clearTimeout(scanTimeout);
                        onMoEntered();
                        e.preventDefault();
                    }
                });
                DOM.moInput.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                    DOM.moInput.value = pastedText.trim().toUpperCase();
                    onMoEntered();
                });
            } else {
                // ⭐ Viewer: không cho nhập MO
                DOM.moInput.readOnly = true;
                DOM.moInput.placeholder = "Viewer mode - chỉ xem";
            }
        }

        // ==================== CORE LOGIC ====================
        async function onMoEntered() {
            if (role !== 'operator') {
                return;
            }

            const mo = DOM.moInput.value.trim().toUpperCase();
            if (!mo) {
                resetDisplay();
                return;
            }
            
            try {
                const res = await fetch(`/api/blow-fill/plan?mo=${encodeURIComponent(mo)}`);
                const data = await res.json();

                if (!data.found) {
                    alert(data.message || `Không tìm thấy kế hoạch cho MO ${mo}`);
                    resetDisplay();
                    return;
                }
                
                DOM.fiberInput.value = data.fiberKit || '';
                currentWc = data.workCenter || '';
                DOM.wcDisplay.textContent = currentWc || '---';
                
                searchProduct();

                setTimeout(async () => {
                    try {
                        if (!connection || !currentProductData || totalSteps <= 0 || targetWeight <= 0) return;

                        await connection.invoke(
                            "BroadcastBlowFillContext",
                            machineId,
                            mo,
                            DOM.fiberInput.value.trim().toUpperCase(),
                            targetWeight,
                            totalSteps,
                            1,
                            0
                        );
                    } catch (err) {
                        console.error("❌ Error broadcasting context:", err);
                    }
                }, 300);
            } catch (e) {
                console.error('❌ Error in onMoEntered:', e);
                alert('Có lỗi khi lấy kế hoạch MO.');
            }
        }

        function searchProduct() {
            const fiberKit = DOM.fiberInput.value.trim().toUpperCase();
            
            if (!fiberKit) {
                resetDisplay();
                return;
            }
            
            currentFiberKitParts = productDatabase[fiberKit] || [];

            // ⭐ Loại bỏ các part trùng description
            currentFiberKitParts = dedupePartsByDescription(currentFiberKitParts);

            if (currentFiberKitParts.length === 0) {
                showNotFound();
                return;
            }

            if (currentFiberKitParts.length > 1) {
                renderPartTabs();
            } else {
                DOM.partTabs.innerHTML = '';
                DOM.partTabs.style.display = 'none';
                partSelected = true;
                loadPart(0);
            }
        }

        function renderPartTabs() {
            if (currentFiberKitParts.length > 1) {
                DOM.partTabs.innerHTML = currentFiberKitParts.map((part, index) => 
                    `<button class="part-tab" id="part-tab-${index}" onclick='loadPart(${index})'>
                        ${part.description}
                    </button>`
                ).join('');
                DOM.partTabs.style.display = 'flex';
                
                partSelected = false;
                DOM.targetWeight.textContent = '0';
                DOM.stepInfo.textContent = '-';
                DOM.stepsContainer.innerHTML = '';
                
            } else if (currentFiberKitParts.length === 1) {
                DOM.partTabs.innerHTML = '';
                DOM.partTabs.style.display = 'none';
                partSelected = true;
                loadPart(0);
            } else {
                DOM.partTabs.innerHTML = '';
                DOM.partTabs.style.display = 'none';
                partSelected = false;
            }
        }

        window.loadPart = function(partIndex) {
            currentProductData = currentFiberKitParts[partIndex];
            totalSteps = currentProductData.steps.length;
            currentStep = 0;
            currentPartIndex = partIndex; 
            
            partSelected = true;
            
            document.querySelectorAll('.part-tab').forEach((tab, index) => {
                tab.classList.toggle('active', index === partIndex);
            });

            createStepIndicators(totalSteps);
            loadStep(0);
        }

        function loadStep(stepIndex) {
            if (!currentProductData || stepIndex >= totalSteps) return;
            
            const step = currentProductData.steps[stepIndex];
            targetWeight = step.target_weight;
            
            DOM.targetWeight.textContent = targetWeight.toFixed(2);
            DOM.stepInfo.textContent = `Step ${stepIndex + 1} of ${totalSteps}`;
            updateStepIndicators(stepIndex);
            
            stepCompleted = false;
            weightStableTime = 0;
            currentStep = stepIndex; 

            if (role === 'operator' && connection) {
                const mo = DOM.moInput.value.trim().toUpperCase();
                const fiber = DOM.fiberInput.value.trim().toUpperCase();
                
                connection.invoke(
                    "BroadcastBlowFillContext",
                    machineId,
                    mo,
                    fiber,
                    targetWeight,
                    totalSteps,
                    stepIndex + 1,   
                    currentPartIndex  
                ).catch(err => console.error("❌ Error broadcasting context on step change:", err));
            }
        }

        function checkWeightStatus() {
            if (!partSelected || !currentProductData) {
                DOM.currentWeight.textContent = currentWeight.toFixed(2);
                return;
            }

            DOM.currentWeight.textContent = currentWeight.toFixed(2);
            
            const lowerLimit = targetWeight - toleranceKg;
            const upperLimit = targetWeight + toleranceKg;

            DOM.currentWeight.className = 'weight-value';
            
            // ⭐ Nếu số âm → Không xử lý trạng thái
            if (currentWeight < 0) {
                weightStableTime = 0;
                return;
            }
            
            if (currentWeight >= lowerLimit && currentWeight <= upperLimit) {
                DOM.currentWeight.classList.add('ok');
                if (!stepCompleted) weightStableTime += 0.1;
            } else if (currentWeight > 0 && currentWeight < lowerLimit) {
                DOM.currentWeight.classList.add('under');
                weightStableTime = 0;
            } else if (currentWeight > upperLimit) {
                DOM.currentWeight.classList.add('over');
                weightStableTime = 0;
            }

            if (weightStableTime >= WEIGHT_STABLE_TIME && !stepCompleted) {
                stepCompleted = true;
                
                let status = "OK";
                if (currentWeight < lowerLimit) status = "UNDER";
                else if (currentWeight > upperLimit) status = "OVER";
                
                logWeighStep(currentStep + 1, targetWeight, currentWeight, toleranceKg, status);
                
                currentStep++;
                if (currentStep >= totalSteps) {
                    completeProduct();
                } else {
                    loadStep(currentStep);
                }
            }
        }

        function completeProduct() {
            for (let i = 0; i < totalSteps; i++) {
                const circle = document.getElementById(`step${i + 1}`);
                if (circle) circle.className = 'circle completed';
            }
            
            productCounter++;
            DOM.counterDisplay.textContent = productCounter;
            
            currentStep = 0;
            loadStep(0);
            currentWeight = 0;
            DOM.currentWeight.textContent = '-';
            DOM.currentWeight.className = 'weight-value';
        }

        // ==================== UI HELPERS ====================
        function resetDisplay() {
            currentFiberKitParts = [];
            currentProductData = null;
            currentStep = 0;
            totalSteps = 0;
            targetWeight = 0;
            stepCompleted = false;
            partSelected = false;  // ⭐ Reset
            
            DOM.targetWeight.textContent = '-';
            DOM.currentWeight.textContent = '-';
            DOM.stepInfo.textContent = '-';
            DOM.stepsContainer.innerHTML = '';
            DOM.partTabs.innerHTML = '';
            DOM.partTabs.style.display = 'none';
            DOM.moInput.value = '';
            DOM.fiberInput.value = '';
        }

        function showNotFound() {
            resetDisplay();
            DOM.targetWeight.textContent = 'NOT FOUND';
            DOM.targetWeight.classList.add('not-found');
        }
        
        function resetCounter() {
            productCounter = 0;
            DOM.counterDisplay.textContent = '0';
            console.log('🔄 Counter reset');
        }

        // ==================== OTHER FUNCTIONS ====================
        async function loadExcelData() {
            try {
                DOM.fiberInput.placeholder = 'Loading Excel...';
                
                const response = await fetch('/api/blow-fill/load-excel');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    productDatabase = data.products;
                    DOM.fiberInput.placeholder = '---';
                } else {
                    throw new Error('Failed to load Excel');
                }
            } catch (error) {
                console.error('❌ Error loading Excel:', error);
                DOM.fiberInput.placeholder = 'Error';
                alert(`Không thể load dữ liệu định mức!\n\nLỗi: ${error.message}`);
            }
        }

        function createStepIndicators(numSteps) {
            DOM.stepsContainer.innerHTML = '';
            for (let i = 1; i <= numSteps; i++) {
                const div = document.createElement('div');
                div.className = 'step-indicator';
                div.innerHTML = `<div class="label">Step ${i}</div><div class="circle pending" id="step${i}">●</div>`;
                DOM.stepsContainer.appendChild(div);
            }
        }

        function updateStepIndicators(currentStepIndex) {
            for (let i = 0; i < totalSteps; i++) {
                const circle = document.getElementById(`step${i + 1}`);
                if (circle) {
                    if (i < currentStepIndex) circle.className = 'circle completed';
                    else if (i === currentStepIndex) circle.className = 'circle current';
                    else circle.className = 'circle pending';
                }
            }
        }

        function updateTolerance() {
            const input = document.getElementById('toleranceInput');
            const value = parseFloat(input.value);
            if (!isNaN(value) && value >= 0) {
                toleranceKg = value / 1000.0;
                console.log(`Tolerance updated to: ±${value}g (±${toleranceKg.toFixed(3)} kg)`);
            } else {
                toleranceKg = 0.05;
            }
        }

        async function logWeighStep(stepNumber, target, actual, tolKg, status) {
            if (role !== 'operator') {
                return;
            }

            try {
                const mo = DOM.moInput.value.trim().toUpperCase();
                const fiber = DOM.fiberInput.value.trim().toUpperCase();
                const body = {
                    machineId: machineId,
                    workCenter: currentWc,
                    mo: mo,
                    fiberKit: fiber,
                    stepNumber: stepNumber,
                    targetWeight: target,
                    actualWeight: actual,
                    tolerance: tolKg,
                    status: status,
                    operatorName: ""
                };
                await fetch('/api/blow-fill/log-step', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
            } catch (e) {
                console.error('Error logging weigh step:', e);
            }
        }
        function dedupePartsByDescription(parts) {
            if (!Array.isArray(parts)) return parts;
            
            const seen = new Set();
            const result = [];
            
            for (const part of parts) {
                const desc = (part.description || "").trim().toUpperCase();
                if (!desc) {
                    // nếu không có description thì cứ giữ
                    result.push(part);
                    continue;
                }
                if (!seen.has(desc)) {
                    seen.add(desc);
                    result.push(part);
                }
                // nếu đã thấy description này rồi → bỏ qua (không thêm nữa)
            }
            return result;
        }
    </script>
</body>
